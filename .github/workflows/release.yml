name: Generate Release Notes

on:
    release:
        types: [created]

jobs:
    update-release-notes:
        name: Update Release with Commit Notes
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get previous tag
              id: prev_tag
              run: |
                  PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.event.release.tag_name }}^ 2>/dev/null || echo "")
                  echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

            - name: Generate commit list
              id: commits
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  REPO_URL="https://github.com/${{ github.repository }}"
                  
                  if [ -n "${{ steps.prev_tag.outputs.tag }}" ]; then
                    RANGE="${{ steps.prev_tag.outputs.tag }}..${{ github.event.release.tag_name }}"
                  else
                    RANGE="${{ github.event.release.tag_name }}"
                  fi
                  
                  # Generate commit list with format: title - @nickname - sha with link
                  COMMITS=""
                  while IFS= read -r line; do
                    SHA=$(echo "$line" | cut -d'|' -f1)
                    SHORT_SHA=$(echo "$line" | cut -d'|' -f2)
                    TITLE=$(echo "$line" | cut -d'|' -f3)
                    
                    # Get GitHub username from commit API
                    USERNAME=$(gh api repos/${{ github.repository }}/commits/$SHA --jq '.author.login // .commit.author.name' 2>/dev/null || echo "unknown")
                    
                    COMMITS="${COMMITS}- ${TITLE} - @${USERNAME} - [\`${SHORT_SHA}\`](${REPO_URL}/commit/${SHA})"$'\n'
                  done < <(git log $RANGE --pretty=format:"%H|%h|%s" --no-merges)
                  
                  # Handle multiline output
                  {
                    echo "list<<EOF"
                    echo "$COMMITS"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Update Release Notes
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.release.tag_name }}
                  body: |
                      ## What's Changed
                      
                      ${{ steps.commits.outputs.list }}
                      
                      **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.event.release.tag_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
