name: Generate Release Notes

on:
    release:
        types: [created]

jobs:
    update-release-notes:
        name: Update Release with Commit Notes
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Check out the repo
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Get previous tag
              id: prev_tag
              run: |
                  # Get all tags sorted by version, find the one before current
                  CURRENT_TAG="${{ github.event.release.tag_name }}"
                  PREV_TAG=$(git tag --sort=-v:refname | grep -A1 "^${CURRENT_TAG}$" | tail -1)
                  
                  # If prev_tag equals current_tag, there's no previous tag
                  if [ "$PREV_TAG" = "$CURRENT_TAG" ]; then
                    PREV_TAG=""
                  fi
                  
                  echo "tag=$PREV_TAG" >> $GITHUB_OUTPUT

            - name: Generate commit list
              id: commits
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  REPO_URL="https://github.com/${{ github.repository }}"
                  CURRENT_TAG="${{ github.event.release.tag_name }}"
                  PREV_TAG="${{ steps.prev_tag.outputs.tag }}"
                  
                  if [ -n "$PREV_TAG" ]; then
                    RANGE="${PREV_TAG}..${CURRENT_TAG}"
                  else
                    RANGE="${CURRENT_TAG}"
                  fi
                  
                  echo "Generating commits for range: $RANGE"
                  
                  # Generate commit list with format: title - @nickname - sha with link
                  COMMITS=""
                  while IFS='|' read -r SHA SHORT_SHA TITLE; do
                    [ -z "$SHA" ] && continue
                    
                    # Get GitHub username from commit API
                    USERNAME=$(gh api "repos/${{ github.repository }}/commits/${SHA}" --jq '.author.login // .commit.author.name' 2>/dev/null || echo "unknown")
                    
                    COMMITS="${COMMITS}- ${TITLE} - @${USERNAME} - [\`${SHORT_SHA}\`](${REPO_URL}/commit/${SHA})"$'\n'
                  done < <(git log "${RANGE}" --pretty=format:"%H|%h|%s" --no-merges 2>/dev/null)
                  
                  # Handle multiline output
                  {
                    echo "list<<EOF"
                    echo "$COMMITS"
                    echo "EOF"
                  } >> $GITHUB_OUTPUT

            - name: Update Release Notes
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event.release.tag_name }}
                  body: |
                      ## What's Changed
                      
                      ${{ steps.commits.outputs.list }}
                      
                      **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.prev_tag.outputs.tag }}...${{ github.event.release.tag_name }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
