name: Publish Helm chart

# Packages the chart and pushes it to GHCR as an OCI artifact.
# The chart version comes from the release tag, so Chart.yaml needs no
# manual bump. The tag v7.5.0 gives chart version 7.5.0 and appVersion v7.5.0.

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: 'Server release tag to publish, for example v7.5.0'
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    publish:
        name: Push the chart to GHCR
        runs-on: ubuntu-latest
        # CLI releases use cli-* tags and have no chart.
        if: ${{ github.event_name == 'workflow_dispatch' || !startsWith(github.event.release.tag_name, 'cli-') }}
        env:
            TAG: ${{ github.event.release.tag_name || inputs.tag }}
            REGISTRY: oci://ghcr.io/hemmeligorg/charts
        steps:
            - name: Check the tag
              id: version
              run: |
                  if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
                      echo "The tag '$TAG' is not a server release tag such as v7.5.0." >&2
                      exit 1
                  fi
                  echo "app=$TAG" >> "$GITHUB_OUTPUT"
                  echo "chart=${TAG#v}" >> "$GITHUB_OUTPUT"

            - name: Check out the repo
              uses: actions/checkout@v6
              with:
                  ref: ${{ env.TAG }}

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: v3.16.4

            - name: Lint the chart
              run: helm lint helm/hemmelig

            - name: Package the chart
              env:
                  CHART_VERSION: ${{ steps.version.outputs.chart }}
                  APP_VERSION: ${{ steps.version.outputs.app }}
              run: |
                  helm package helm/hemmelig \
                      --version "$CHART_VERSION" \
                      --app-version "$APP_VERSION" \
                      --destination dist-chart

            - name: Log in to GHCR
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  ACTOR: ${{ github.actor }}
              run: printf '%s' "$GITHUB_TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

            - name: Push the chart
              env:
                  CHART_VERSION: ${{ steps.version.outputs.chart }}
              run: helm push "dist-chart/hemmelig-${CHART_VERSION}.tgz" "$REGISTRY"
